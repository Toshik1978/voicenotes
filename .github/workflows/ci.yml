name: Lint, Test & Build

# Lints, tests and builds; never publishes. Images are published only by
# release.yml, from v* tags.
on:
  push:
    branches:
      - main
  pull_request:
  # Lets release.yml gate publishing on the same lint, test and build, so a
  # v* tag push is checked there rather than by a second run of this file.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go-version-file, not a literal: go.mod already states the floor, and a
      # second copy in this file could only fall out of step with it. Every job
      # reads the same source, so lint, test and build cannot disagree.
      #
      # check-latest buys the patch version: go.mod names a minor with no
      # patch, and without the flag the action stops at whatever the runner
      # image pre-baked, which this repository cannot see or influence.
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Run Golang linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Setup project
        run: task setup

      # Run the whole suite (so the test count reflects every package), but
      # measure coverage only over the gate scope. -coverpkg MUST stay
      # identical to COVERPKG in Taskfile.yml. Don't fail the step here: the
      # badge update below must still publish on failure. The real exit code
      # is captured for the gate at the end.
      - name: Run tests with coverage
        run: |
          set +e
          go test -race -v \
            -coverpkg=./internal/config,./internal/capture,./internal/pipeline,./internal/language,./internal/enrich,./internal/render,./internal/digest,./internal/health \
            -covermode=atomic -coverprofile=coverage.txt \
            ./... > test_status.log 2>&1
          echo "TEST_EXIT=$?" >> "$GITHUB_ENV"
          set -e
          cat test_status.log

      - name: Process test results and coverage
        run: |
          PASSED=$(grep -c -- "--- PASS:" test_status.log || true)
          FAILED=$(grep -c -- "--- FAIL:" test_status.log || true)
          SKIPPED=$(grep -c -- "--- SKIP:" test_status.log || true)

          MSG=""
          [ "$PASSED" -gt 0 ] && MSG="${PASSED} passed"
          [ "$FAILED" -gt 0 ] && MSG="${MSG:+$MSG, }${FAILED} failed"
          [ "$SKIPPED" -gt 0 ] && MSG="${MSG:+$MSG, }${SKIPPED} skipped"
          [ -z "$MSG" ] && MSG="0 tests"
          echo "TEST_BADGE_MSG=$MSG" >> "$GITHUB_ENV"

          if [ "${TEST_EXIT:-0}" -ne 0 ] || [ "$FAILED" -gt 0 ]; then
            echo "TEST_BADGE_COLOR=red" >> "$GITHUB_ENV"
            echo "TESTS_FAILED=true" >> "$GITHUB_ENV"
          elif [ "$SKIPPED" -gt 0 ]; then
            echo "TEST_BADGE_COLOR=yellow" >> "$GITHUB_ENV"
            echo "TESTS_FAILED=false" >> "$GITHUB_ENV"
          else
            echo "TEST_BADGE_COLOR=green" >> "$GITHUB_ENV"
            echo "TESTS_FAILED=false" >> "$GITHUB_ENV"
          fi

          if [ -f coverage.txt ]; then
            go tool cover -func=coverage.txt -o coverage_func.txt
            TOTAL=$(tail -n 1 coverage_func.txt | awk '{print $3}' | tr -d '%')
            [ -z "$TOTAL" ] && TOTAL="0"
          else
            TOTAL="0"
          fi
          echo "TOTAL_COVERAGE=$TOTAL" >> "$GITHUB_ENV"

          COV_INT=$(echo "$TOTAL" | cut -d'.' -f1)
          if [ "$COV_INT" -ge 80 ]; then
            echo "COVERAGE_BADGE_COLOR=green" >> "$GITHUB_ENV"
          elif [ "$COV_INT" -ge 50 ]; then
            echo "COVERAGE_BADGE_COLOR=yellow" >> "$GITHUB_ENV"
          else
            echo "COVERAGE_BADGE_COLOR=red" >> "$GITHUB_ENV"
          fi

      - name: Update gist badges
        # Badges publish only on push to main (not on PRs or release tags).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TEST_BADGE_MSG: ${{ env.TEST_BADGE_MSG }}
          TEST_BADGE_COLOR: ${{ env.TEST_BADGE_COLOR }}
          TOTAL_COVERAGE: ${{ env.TOTAL_COVERAGE }}
          COVERAGE_BADGE_COLOR: ${{ env.COVERAGE_BADGE_COLOR }}
        with:
          github-token: ${{ secrets.GIST_SECRET_TOKEN }}
          script: |
            await github.rest.gists.update({
              gist_id: process.env.GIST_ID,
              files: {
                'tests.json': {
                  content: JSON.stringify({
                    schemaVersion: 1,
                    label: 'Tests',
                    namedLogo: 'go',
                    message: process.env.TEST_BADGE_MSG,
                    color: process.env.TEST_BADGE_COLOR,
                    cacheSeconds: 180,
                  }, null, 2),
                },
                'coverage.json': {
                  content: JSON.stringify({
                    schemaVersion: 1,
                    label: 'Coverage',
                    namedLogo: 'go',
                    message: process.env.TOTAL_COVERAGE + '%',
                    color: process.env.COVERAGE_BADGE_COLOR,
                    cacheSeconds: 180,
                  }, null, 2),
                },
              },
            });

      - name: Convert coverage to Cobertura
        if: github.event_name == 'pull_request'
        run: go run github.com/boumenot/gocover-cobertura@latest < coverage.txt > coverage.xml

      - name: Code coverage report
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          hide_branch_rate: true
          hide_complexity: true
          format: markdown
          output: both
          thresholds: '50 80'

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md

      # Runs AFTER the badge update so the (red) badges still publish. The
      # floor script is shared with `task test:coverage`.
      - name: Check test and coverage gates
        run: |
          if [ "${{ env.TESTS_FAILED }}" = "true" ] || [ "${TEST_EXIT:-0}" -ne 0 ]; then
            echo "Tests failed (parsed=${{ env.TESTS_FAILED }}, exit=${TEST_EXIT:-0})."
            exit 1
          fi
          .github/scripts/check-coverage-floor.sh coverage.txt 80

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Setup project
        run: task setup

      # task build sets CGO_ENABLED=0.
      - name: Run build
        run: task build
